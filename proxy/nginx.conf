worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket upgrade helper (used by the /live/api/ws proxy to go2rtc)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The scheme the *client* actually used. cloudflared terminates TLS and
    # forwards plain HTTP to nginx, so $scheme is always "http" here --
    # overwriting X-Forwarded-Proto with it told the backend that an HTTPS
    # request was insecure, so it never marked the session cookie Secure.
    # Fall back to $scheme only for direct LAN hits, which carry no such header.
    # Only the first token is kept: nginx comma-joins repeated headers, and
    # Fastify reads the *last* entry of a multi-value X-Forwarded-Proto, so
    # passing "https, http" straight through would report plain http again.
    map $http_x_forwarded_proto $client_proto {
        default       $scheme;
        "~*^(https?)" $1;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;

        root /usr/share/nginx/html;
        index index.html;

        # Backend REST + SSE API
        location /api/ {
            proxy_pass http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_proto;

            # /api/events/stream is Server-Sent Events: no buffering, no timeout cutoff.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # go2rtc WebRTC signaling (actually needs the Upgrade/Connection
        # headers for the websocket handshake)
        location /live/api/ws {
            proxy_pass http://go2rtc:1984/api/ws;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # go2rtc MSE/HLS live streaming (Safari fallback + HLS segment
        # sub-requests, both under /api/): plain HTTP, no Upgrade involved.
        # Forcing Connection: close here (via the websocket map) was
        # preventing HLS's persistent/long-poll requests from staying open,
        # which made go2rtc tear down its ffmpeg producer every few seconds.
        #
        # Deliberately scoped to /live/api/ only, NOT /live/ as a whole:
        # go2rtc serves its own built-in admin dashboard (index.html,
        # main.js, streams UI) at its HTTP root, which collided with the
        # SPA's own client-side /live route -- a full page load/refresh of
        # /live was being caught by this proxy and landed on go2rtc's own
        # UI instead of ever reaching index.html for React Router to handle.
        location /live/api/ {
            proxy_pass http://go2rtc:1984/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Recorded clips/segments/thumbnails served by the backend (static files
        # on the NAS mount).
        #
        # Deliberately matched on the file extension rather than the /recordings/
        # prefix: the SPA owns a client-side /recordings route in the same URL
        # space, so a plain prefix sent /recordings/ to the backend, which has no
        # directory index there and answered 404 instead of loading the app --
        # the same collision /live had. A regex location also wins over the SPA
        # fallback below, so real media requests still reach the backend.
        #
        # proxy_pass carries no URI part on purpose: nginx then forwards the
        # original path untouched, which is what the backend already serves.
        location ~ ^/recordings/.+\.(mp4|jpg|jpeg|png|webp)$ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Build output is content-hashed, so it can be cached hard.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # The service worker and the app shell must never come from a cache.
        # A stale sw.js is self-perpetuating: the browser keeps running the old
        # worker, which keeps serving the old bundle, and no deploy can ever
        # reach the device. These are also what let the uninstalling worker
        # below actually be picked up.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires off;
        }

        location = /registerSW.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires off;
        }

        # SPA fallback
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
