worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket upgrade helper (used by the /live/ proxy to go2rtc)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;

        root /usr/share/nginx/html;
        index index.html;

        # Backend REST + SSE API
        location /api/ {
            proxy_pass http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # /api/events/stream is Server-Sent Events: no buffering, no timeout cutoff.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # go2rtc WebRTC signaling (actually needs the Upgrade/Connection
        # headers for the websocket handshake)
        location /live/api/ws {
            proxy_pass http://go2rtc:1984/api/ws;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # go2rtc MSE/HLS live streaming: plain HTTP, no Upgrade involved.
        # Forcing Connection: close here (via the websocket map) was
        # preventing HLS's persistent/long-poll requests from staying open,
        # which made go2rtc tear down its ffmpeg producer every few seconds.
        location /live/ {
            proxy_pass http://go2rtc:1984/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Recorded clips/segments served directly by the backend (static files on the NAS mount)
        location /recordings/ {
            proxy_pass http://backend:3000/recordings/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # SPA fallback
        location / {
            try_files $uri /index.html;
        }
    }
}
